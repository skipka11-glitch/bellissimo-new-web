<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ďakujeme — Bellissimo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500&display=swap" rel="stylesheet">
<style>
  :root{--cream:#f1ebe0;--espresso:#2a221b;--ink:#3a2f25;--taupe:#8c7f6d;--sienna:#9c5a30;--sienna-dk:#8a4d28;--line:#cabfaa}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--cream);color:var(--ink);font-family:"EB Garamond",Georgia,serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px}
  .card{max-width:560px}
  .flourish{color:var(--sienna);font-size:26px;margin-bottom:22px}
  .brand{font-family:"Cormorant Garamond",serif;text-transform:uppercase;letter-spacing:.3em;font-size:22px;font-weight:600;color:var(--espresso);margin-bottom:30px}
  h1{font-family:"Cormorant Garamond",serif;font-weight:500;color:var(--espresso);font-size:clamp(40px,7vw,64px);line-height:1.05;margin-bottom:18px}
  h1 i{font-style:italic}
  p{font-size:19px;color:#5f5445;line-height:1.6;margin-bottom:34px}
  .btn{display:inline-block;padding:15px 32px;border-radius:2px;font-size:14px;letter-spacing:.14em;text-transform:uppercase;background:var(--sienna);color:#f6efe4;transition:background .25s}
  .btn:hover{background:var(--sienna-dk)}
  .rule{width:60px;height:1px;background:var(--line);margin:40px auto 0}
</style>
</head>
<body>
  <div class="card">
    <div class="flourish">✦</div>
    <div class="brand">Bellissimo</div>
    <h1>Ďakujeme,<br><i>ozveme sa vám.</i></h1>
    <p>Vašu správu sme prijali. Rezerváciu vám čo najskôr potvrdíme e-mailom alebo telefonicky. Tešíme sa na vašu návštevu.</p>
    <a class="btn" href="index.html">Späť na úvod</a>
    <div class="rule"></div>
  </div>
</body>
</html>
