<!doctype html>
<html lang="sk">

<!--

  Everything you are likely to edit lives in COPY, COL and the scene timings near the top of the script.
-->
<style>

  @font-face { font-family: IDBold;  src: url(fonts/InterDisplay-Bold.otf); }

<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="ui">
  <button id="play">▶︎ / ❚❚</button>
  <input id="scrub" type="range" min="0" max="449" value="0">

</div>
<audio id="snd" src="audio/soundtrack.wav" preload="auto"></audio>
<script>
'use strict';
/* ───────────────────────────── editable content ───────────────────────────── */
const W = 1920, H = 1080, FPS = 30, DURATION = 15, FRAMES = FPS * DURATION;

// Brand palette – sampled from gls-slovakia.sk (header blue #061AB1, logo yellow #FFD100).
// Confirm against the official brand guide and change here only.
const COL = {
  blue: '#061AB1', yellow: '#FFD100', sky: '#C9E7F2',
  ink: '#0B1240', muted: '#5A6390', paper: '#FFFFFF',
  land: '#F2F5FC', landSide: '#DFE5F5', landEdge: '#B9C4E8', net: '#D9E0F3', grid: '#E2E7F4',
  track: '#E3E8F7', preview: '#9AA7DE',
  box1: '#EBC991', box2: '#D9AE6C', box3: '#C49457',
};

const COPY = {
  hook:   'Kam až môže doraziť jeden balík?',
  pickup: ['Zabalíte.', 'Vyzdvihneme.'],
  track:  'Viete, kde váš balík je.',
  flex:   'Doručenie podľa vás.',
  time:   ['Včas.', 'Bez stresu.'],
  claim:  'Doručujeme vašu dôveru.',          // client to confirm final wording
  credit: 'Koncept: Petra [priezvisko]',
  note:   'Nezávislý portfolio projekt',
  status: 'Stav zásielky',
  steps:  ['Vyzdvihnutý', 'Na ceste', 'Doručenie'],
  options:['Domov', 'Výdajné miesto', 'Výdajný box'],
  window: 'Vaše časové okno',
};

/* ───────────────────────────── helpers ───────────────────────────── */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const expLerp = (a, b, k) => Math.exp(lerp(Math.log(a), Math.log(b), k));
const E = {
  inQuad: k => k * k,
  outCubic: k => 1 - Math.pow(1 - k, 3),
  inCubic: k => k * k * k,
  inOutCubic: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  outQuart: k => 1 - Math.pow(1 - k, 4),
  inOutQuart: k => k < .5 ? 8 * k ** 4 : 1 - Math.pow(-2 * k + 2, 4) / 2,
  outExpo: k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k),
  inExpo: k => k <= 0 ? 0 : Math.pow(2, 10 * k - 10),
  inOutExpo: k => k <= 0 ? 0 : k >= 1 ? 1 : k < .5 ? Math.pow(2, 20 * k - 10) / 2 : (2 - Math.pow(2, -20 * k + 10)) / 2,
  outBack: (k, s = 1.7) => 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2),
  inOutSine: k => -(Math.cos(Math.PI * k) - 1) / 2,
};
const mix = (p, q, k) => ({ x: lerp(p.x, q.x, k), y: lerp(p.y, q.y, k) });

/* ───────────────────────────── map data ───────────────────────────── */
// Slovakia outline, Natural Earth 1:10m (public domain), simplified.
const SVK = [[22.54,49.072],[22.521,48.993],[22.449,48.971],[22.412,48.888],[22.369,48.856],[22.366,48.794],[22.331,48.756],[22.31,48.682],[22.243,48.651],[22.139,48.57],[22.148,48.509],[22.133,48.405],[22.096,48.379],[21.929,48.373],[21.789,48.336],[21.728,48.341],[21.622,48.43],[21.592,48.493],[21.522,48.5],[21.499,48.535],[21.425,48.561],[21.322,48.548],[21.262,48.503],[21.22,48.519],[21.109,48.489],[21.036,48.515],[20.946,48.519],[20.8,48.569],[20.511,48.534],[20.482,48.526],[20.482,48.479],[20.421,48.429],[20.324,48.28],[20.272,48.252],[20.229,48.271],[20.171,48.244],[20.135,48.247],[20.105,48.203],[19.929,48.13],[19.884,48.13],[19.822,48.158],[19.776,48.15],[19.774,48.186],[19.757,48.2],[19.687,48.197],[19.623,48.227],[19.514,48.204],[19.482,48.111],[19.428,48.086],[19.293,48.088],[19.223,48.061],[18.996,48.066],[18.838,48.04],[18.794,47.993],[18.743,47.971],[18.755,47.952],[18.749,47.871],[18.816,47.833],[18.768,47.822],[18.693,47.778],[18.553,47.793],[18.236,47.754],[17.826,47.75],[17.677,47.789],[17.604,47.834],[17.573,47.83],[17.527,47.872],[17.472,47.889],[17.338,47.999],[17.185,48.02],[17.148,48.005],[17.07,48.036],[17.075,48.052],[17.059,48.06],[17.08,48.098],[17.047,48.131],[16.982,48.161],[16.954,48.273],[16.917,48.291],[16.898,48.316],[16.902,48.339],[16.844,48.366],[16.865,48.458],[16.906,48.51],[16.947,48.54],[16.948,48.623],[17.025,48.746],[17.114,48.834],[17.212,48.866],[17.374,48.82],[17.453,48.843],[17.535,48.813],[17.727,48.863],[17.796,48.921],[17.86,48.922],[17.914,49.01],[18.046,49.029],[18.096,49.07],[18.105,49.17],[18.161,49.259],[18.385,49.342],[18.388,49.39],[18.417,49.385],[18.515,49.441],[18.536,49.482],[18.636,49.497],[18.733,49.48],[18.792,49.51],[18.932,49.504],[18.961,49.493],[18.962,49.389],[19.068,49.406],[19.142,49.394],[19.173,49.402],[19.189,49.442],[19.209,49.445],[19.204,49.461],[19.234,49.507],[19.34,49.529],[19.443,49.602],[19.505,49.563],[19.557,49.454],[19.635,49.441],[19.627,49.402],[19.769,49.393],[19.79,49.309],[19.78,49.293],[19.809,49.271],[19.748,49.206],[19.786,49.188],[19.854,49.191],[19.938,49.225],[20.05,49.173],[20.07,49.183],[20.086,49.243],[20.136,49.309],[20.16,49.306],[20.207,49.334],[20.284,49.339],[20.318,49.392],[20.422,49.383],[20.422,49.4],[20.438,49.403],[20.544,49.371],[20.605,49.4],[20.69,49.401],[20.778,49.331],[20.919,49.29],[21.017,49.352],[21.073,49.357],[21.069,49.381],[21.033,49.4],[21.054,49.414],[21.125,49.424],[21.194,49.401],[21.261,49.449],[21.428,49.41],[21.62,49.423],[21.692,49.402],[21.758,49.349],[21.82,49.377],[21.964,49.309],[21.993,49.278],[22.012,49.211],[22.041,49.197],[22.198,49.172],[22.216,49.14],[22.339,49.126],[22.39,49.093]];

const LONK = Math.cos(48.7 * Math.PI / 180);
const P = (lon, lat) => ({ x: (lon - 19.6) * LONK, y: 48.7 - lat });   // world units = degrees of latitude
const CITY = {
  BA: [17.107, 48.148, 'Bratislava'], TT: [17.587, 48.377, 'Trnava'], NR: [18.087, 48.308, 'Nitra'],
  TN: [18.044, 48.894, 'Trenčín'], ZA: [18.740, 49.223, 'Žilina'], MT: [18.921, 49.066, 'Martin'],
  BB: [19.146, 48.736, 'Banská Bystrica'], ZV: [19.124, 48.578, 'Zvolen'], LC: [19.667, 48.331, 'Lučenec'],
  PP: [20.297, 49.056, 'Poprad'], RV: [20.532, 48.664, 'Rožňava'], PO: [21.239, 48.998, 'Prešov'],
  KE: [21.258, 48.717, 'Košice'], MI: [21.917, 48.755, 'Michalovce'], HE: [21.906, 48.937, 'Humenné'],
  NZ: [18.163, 47.986, 'Nové Zámky'], KN: [18.130, 47.763, 'Komárno'],
};
const C = {}; for (const k in CITY) C[k] = P(CITY[k][0], CITY[k][1]);
const LAND = SVK.map(([lo, la]) => P(lo, la));
const NET = [['BA','TT'],['TT','TN'],['TN','ZA'],['ZA','MT'],['MT','BB'],['NR','ZV'],['ZV','BB'],['ZV','LC'],['LC','RV'],['RV','KE'],
             ['ZA','PP'],['PP','PO'],['PO','KE'],['KE','MI'],['PO','HE'],['HE','MI'],['NR','NZ'],['NZ','KN'],['BA','NZ'],['NR','TN'],['BB','LC']];
const ROUTE_STOPS = ['BA', 'TT', 'NR', 'BB', 'PP', 'KE'];

// Catmull-Rom through the stops → dense polyline with cumulative length.
const ROUTE = (() => {
  const pts = ROUTE_STOPS.map(k => C[k]);
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    for (let s = 0; s < 40; s++) {
      const u = s / 40, u2 = u * u, u3 = u2 * u;
      const f = (a, b, c, d) => 0.5 * ((2 * b) + (-a + c) * u + (2 * a - 5 * b + 4 * c - d) * u2 + (-a + 3 * b - 3 * c + d) * u3);
      out.push({ x: f(p0.x, p1.x, p2.x, p3.x), y: f(p0.y, p1.y, p2.y, p3.y) });
    }
  }
  out.push(pts[pts.length - 1]);
  let L = 0; out[0].d = 0;
  for (let i = 1; i < out.length; i++) { L += Math.hypot(out[i].x - out[i - 1].x, out[i].y - out[i - 1].y); out[i].d = L; }
  out.forEach(p => p.f = p.d / L);
  const stopF = ROUTE_STOPS.map((k, i) => out[Math.min(out.length - 1, i * 40)].f);
  return { pts: out, len: L, stopF };
})();
function routeAt(f) {
  const pts = ROUTE.pts; f = clamp(f);
  let i = 1; while (i < pts.length - 1 && pts[i].f < f) i++;
  const a = pts[i - 1], b = pts[i], k = (f - a.f) / Math.max(1e-9, b.f - a.f);
  return { x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k), ang: Math.atan2(b.y - a.y, b.x - a.x) };
}

/* ───────────────────────────── timeline ───────────────────────────── */
// Story beats (seconds). Sound cues in sound.py mirror these.
const T = { hook: 0, pickup: 2.0, track: 4.0, flex: 6.5, time: 9.0, reveal: 11.5 };
const F = { x: 960, y: 600 };            // screen point the camera looks at
const MID = { x: P(19.69, 48.68).x, y: P(19.69, 48.68).y - 0.02 };
const BAOFF = { x: C.BA.x + 160 / 1850, y: C.BA.y - 0.004 };
const VAN_LEN = 0.19, PARCEL = 0.07;     // world units

// Route progress: van leaves BA, then the tracking marker eases into Košice.
const F_TT = ROUTE.stopF[1];
function routeProgress(t) {
  if (t < 3.45) return 0;
  if (t < 4.05) return F_TT * E.inQuad(prog(t, 3.45, 4.05));
  const u = prog(t, 4.05, 6.4), p0 = F_TT, p1 = 1;
  const m0 = Math.min((2 * F_TT / 0.6) * 2.35, 2.9 * (p1 - p0));
  return (2*u**3 - 3*u**2 + 1) * p0 + (u**3 - 2*u**2 + u) * m0 + (-2*u**3 + 3*u**2) * p1;
}

function camera(t) {
  if (t < 0.5) return { x: C.BA.x, y: C.BA.y, z: lerp(2300, 2200, t / 0.5) };
  if (t < 2.0) {
    const k = E.inOutCubic(prog(t, 0.5, 1.5));
    const z = t < 1.5 ? expLerp(2200, 345, k) : lerp(345, 368, prog(t, 1.5, 2.0));
    const p = mix(C.BA, MID, k);
    return { x: p.x, y: p.y, z };
  }
  if (t < 3.3) {
    const k = E.inOutQuart(prog(t, 2.0, 2.42));
    const p = mix(MID, BAOFF, k);
    return { x: p.x, y: p.y, z: t < 2.42 ? expLerp(368, 1850, k) : lerp(1850, 1900, prog(t, 2.42, 3.3)) };
  }
  const r = routeProgress(t), m = routeAt(r);
  if (t < 4.3) {
    const k = E.inOutCubic(prog(t, 3.3, 3.95));
    const p = mix(BAOFF, m, k);
    return { x: p.x, y: p.y, z: expLerp(1900, 560, E.inOutCubic(prog(t, 3.35, 4.25))) };
  }
  if (t < 6.35) return { x: m.x, y: m.y, z: lerp(560, 500, prog(t, 4.3, 6.35)) };
  const k = E.inOutCubic(prog(t, 6.35, 7.0));
  return { x: C.KE.x + 0.02 * prog(t, 7, 15), y: C.KE.y, z: expLerp(500, 1500, k) * (1 + 0.06 * prog(t, 7, 11.5)) };
}
const w2s = (p, cam) => ({ x: F.x + (p.x - cam.x) * cam.z, y: F.y + (p.y - cam.y) * cam.z });

/* ───────────────────────────── canvas ───────────────────────────── */
const out = document.getElementById('c'), octx = out.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
const ctx = buf.getContext('2d');

function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function poly(pts, fill) { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); }
function circle(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }
function check(x, y, s, color, k = 1, lw) {           // tick mark centred at x,y, drawn on by k
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = lw || s * 0.22; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const a = [x - s * .42, y + s * .02], b = [x - s * .12, y + s * .32], c = [x + s * .45, y - s * .3];
  const l1 = Math.hypot(b[0] - a[0], b[1] - a[1]), l2 = Math.hypot(c[0] - b[0], c[1] - b[1]);
  ctx.setLineDash([(l1 + l2) * k, 1e4]);
  ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.lineTo(...c); ctx.stroke(); ctx.restore();
}
function badge(x, y, r, k) {                          // blue circle + white tick, pops in with k
  if (k <= 0) return;
  const s = E.outBack(clamp(k * 1.6), 2.2);
  circle(x, y, r * s, COL.blue);
  check(x, y, r * 0.95, '#fff', clamp(k * 2 - 0.5), r * 0.26);
}
function ring(x, y, r, lw, color, a) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke(); ctx.restore(); }

/* ── headline system: words rise out of a mask, each with its own start time ── */
const layoutCache = new Map();
function layout(words, size, maxW) {
  const key = words.join('|') + size;
  if (layoutCache.has(key)) return layoutCache.get(key);
  ctx.font = `${size}px IDBlack`;
  const space = ctx.measureText(' ').width, lines = [];
  let cur = [], w = 0;
  words.forEach((word, i) => {
    if (word === '\n') { if (cur.length) { lines.push({ items: cur, w }); cur = []; w = 0; } return; }
    const ww = ctx.measureText(word).width;
    if (cur.length && w + space + ww > maxW) { lines.push({ items: cur, w }); cur = []; w = 0; }
    cur.push({ word, i, w: ww }); w += (cur.length > 1 ? space : 0) + ww;
  });
  lines.push({ items: cur, w });
  const res = { lines, space, size };
  layoutCache.set(key, res);
  return res;
}
// spec: { parts:[{text, at}], out, top, size, color, split }  – split: every part starts a new line
function headline(t, spec) {
  if (t < spec.parts[0].at - 0.01 || t > spec.out + 0.4) return;
  const words = [], times = [];
  spec.parts.forEach((p, pi) => {
    if (spec.split && pi) { words.push('\n'); times.push(0); }
    p.text.split(' ').forEach((w, j) => { words.push(w); times.push(p.at + j * 0.055); });
  });
  const size = spec.size || 80, MAXW = 580;
  let L = layout(words, size, MAXW);
  // balance the rag: narrowest measure that keeps the same number of lines
  for (let mw = MAXW - 10, n = L.lines.length; !spec.split && mw > 200 && n > 1; mw -= 10) {
    const L2 = layout(words, size, mw);
    if (L2.lines.length !== n || L2.lines.some(l => l.w > mw + 0.5)) break;
    L = L2;
  }
  const lh = size * 1.08, color = spec.color || COL.blue;
  const kOut = E.inCubic(prog(t, spec.out, spec.out + 0.32));
  ctx.font = `${size}px IDBlack`; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = color;
  L.lines.forEach((line, li) => {
    let x = 960 - line.w / 2;
    const top = spec.top + li * lh;
    line.items.forEach(it => {
      const k = E.outExpo(prog(t, times[it.i] + li * 0.06, times[it.i] + li * 0.06 + 0.55));
      if (k > 0) {
        ctx.save();
        ctx.beginPath(); ctx.rect(x - 10, top - 6, it.w + 20, lh + 4); ctx.clip();
        const dy = (1 - k) * lh - kOut * lh;
        ctx.globalAlpha = clamp(k * 2) * (1 - kOut);
        ctx.fillText(it.word, x, top + size * 0.86 + dy);
        ctx.restore();
      }
      x += it.w + L.space;
    });
  });
}

/* ── background: dot grid with parallax for depth ── */
function drawGrid(cam, alpha) {
  if (alpha <= 0) return;
  const g = 46 * Math.pow(cam.z / 600, 0.25);
  const ox = ((-cam.x * cam.z * 0.25) % g + g) % g, oy = ((-cam.y * cam.z * 0.25) % g + g) % g;
  ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = COL.grid;
  for (let x = ox - g; x < W + g; x += g) for (let y = oy - g; y < H + g; y += g) { ctx.beginPath(); ctx.arc(x, y, 2, 0, 6.283); ctx.fill(); }
  ctx.restore();
}

/* ── map: extruded land slab, road network, route ── */
let landPerim = 0;
for (let i = 0; i < LAND.length; i++) { const a = LAND[i], b = LAND[(i + 1) % LAND.length]; landPerim += Math.hypot(b.x - a.x, b.y - a.y); }
function landPath(cam, dx = 0, dy = 0) {
  ctx.beginPath();
  LAND.forEach((p, i) => { const s = w2s(p, cam); i ? ctx.lineTo(s.x + dx, s.y + dy) : ctx.moveTo(s.x + dx, s.y + dy); });
  ctx.closePath();
}
function drawMap(t, cam, alpha, draw) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha;
  const depth = clamp(cam.z / 30, 6, 22);
  ctx.globalAlpha = alpha * draw;
  landPath(cam, 0, depth); ctx.fillStyle = COL.landSide; ctx.fill();
  landPath(cam); ctx.fillStyle = COL.land; ctx.fill();
  ctx.globalAlpha = alpha;
  // road network
  ctx.save(); landPath(cam); ctx.clip();
  ctx.strokeStyle = COL.net; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  NET.forEach(([a, b], i) => {
    const k = E.outCubic(prog(draw, 0.2 + i * 0.02, 0.7 + i * 0.02));
    if (k <= 0) return;
    const p = w2s(C[a], cam), q = w2s(C[b], cam);
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(lerp(p.x, q.x, k), lerp(p.y, q.y, k)); ctx.stroke();
  });
  ctx.restore();
  // outline draws itself
  landPath(cam);
  ctx.strokeStyle = COL.landEdge; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
  const per = landPerim * cam.z;
  ctx.setLineDash([per * E.inOutCubic(draw), per + 10]); ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();
}
function routePath(cam, f0, f1) {
  const pts = ROUTE.pts; ctx.beginPath();
  const a = w2s(routeAt(f0), cam); ctx.moveTo(a.x, a.y);
  for (const p of pts) if (p.f > f0 && p.f < f1) { const s = w2s(p, cam); ctx.lineTo(s.x, s.y); }
  const b = w2s(routeAt(f1), cam); ctx.lineTo(b.x, b.y);
}
function cityDot(t, key, cam, reached, labelA, labelSide = 1) {
  const s = w2s(C[key], cam);
  if (s.x < -200 || s.x > W + 200 || s.y < -100 || s.y > H + 100) return;
  const k = E.outBack(clamp(reached * 3), 3);

  }

  // ── flexibility: one parcel, three ways home ──
  if (t > 6.5 && t < 9.4) {
    const fade = 1 - E.inOutCubic(prog(t, 8.75, 9.1));
    const sel = E.outCubic(prog(t, 7.86, 8.05));
    // paths
    ctx.lineCap = 'round';
    OPTS.forEach((o, i) => {
      const k = E.outCubic(prog(t, 6.85 + i * 0.09, 7.25 + i * 0.09));
      if (k <= 0) return;
      ctx.save();
      ctx.globalAlpha = fade * (i === CHOSEN ? 1 : 1 - 0.82 * sel);
      ctx.strokeStyle = COL.blue; ctx.lineWidth = i === CHOSEN ? 6 + 3 * sel : 6;
      if (i !== CHOSEN && sel > 0) ctx.setLineDash([1, 14]);
      strokeBez(optPath(i), 0, k);
      ctx.restore();
    });
    // tiles + labels
    OPTS.forEach((o, i) => {
      const k = E.outBack(prog(t, 7.1 + i * 0.09, 7.42 + i * 0.09), 2);
      if (k <= 0) return;
      const chosen = i === CHOSEN;
      const a = fade * (chosen ? 1 : 1 - 0.75 * sel);
      const press = chosen ? 1 - 0.08 * Math.sin(Math.PI * prog(t, 7.78, 7.98)) + 0.06 * sel : 1;
      const s = 122 * k * press;
      ctx.save(); ctx.globalAlpha = a;
      tile(o.x, o.y, s, chosen ? sel : 0, 1);
      const ik = k * press;
      if (i === 0) iconHome(o.x, o.y, ik); else if (i === 1) iconShop(o.x, o.y, ik);
      else iconLocker(o.x, o.y, ik, E.outCubic(prog(t, 8.5, 8.62)));
      ctx.font = '26px IDBold'; ctx.textAlign = 'center'; ctx.fillStyle = chosen && sel > 0 ? COL.blue : COL.ink;
      ctx.globalAlpha = a * clamp(k);
      ctx.fillText(COPY.options[i], o.x, o.y + 104);
      ctx.restore();
    });
    // fingertip tap
    const fin = prog(t, 7.42, 7.8), fout = prog(t, 8.05, 8.3);
    if (fin > 0 && fout < 1) {
      const o = OPTS[CHOSEN], k = E.outCubic(fin);
      const fx = lerp(1300, o.x + 26, k), fy = lerp(1040, o.y + 20, k);
      const pr = 1 - 0.18 * Math.sin(Math.PI * prog(t, 7.8, 7.98));
      ctx.save(); ctx.globalAlpha = (1 - fout) * clamp(fin * 3);
      ctx.shadowColor = 'rgba(11,18,64,.3)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
      circle(fx, fy, 30 * pr, 'rgba(255,255,255,.96)'); ctx.shadowColor = 'transparent';
      ctx.lineWidth = 4; ctx.strokeStyle = COL.blue; ctx.beginPath(); ctx.arc(fx, fy, 30 * pr, 0, 6.283); ctx.stroke();
      ctx.restore();
      const rp = prog(t, 7.86, 8.35);
      if (rp > 0 && rp < 1) { ring(o.x, o.y, 70 + 70 * E.outCubic(rp), 4, COL.yellow, 1 - rp); ring(o.x, o.y, 70 + 40 * E.outCubic(rp), 3, COL.blue, (1 - rp) * 0.6); }
    }
    // the parcel: grows out of the map marker, then rides the chosen path into the locker
    const grow = E.inOutCubic(prog(t, 6.55, 6.9));
    if (t < 8.6) {
      let px = lerp(960, OPT_PARCEL.x, grow), py = lerp(600 + 10, OPT_PARCEL.y, grow), ps = lerp(36, 112, grow);
      const ride = prog(t, 7.98, 8.55);
      if (ride > 0) {
        const q = bez(optPath(CHOSEN), E.inOutCubic(ride));
        px = q.x; py = q.y + 18 * (1 - ride); ps = lerp(112, 22, E.inCubic(ride));
        // deliver into the lit locker cell
        const cell = { x: OPTS[CHOSEN].x + 20, y: OPTS[CHOSEN].y + 12 };
        const k2 = E.inCubic(prog(ride, 0.7, 1));
        px = lerp(px, cell.x, k2); py = lerp(py, cell.y, k2);
      }
      ctx.save(); ctx.globalAlpha = clamp(grow * 3);
      drawParcel(px, py, ps, { shadowA: 1 - ride });
      ctx.restore();
    }
  }

  // ── reliability: the lit locker cell becomes the delivery time window ──
  if (t > 8.75 && t < 12.2) {
    const a = 1 - E.inOutCubic(prog(t, 11.35, 11.7));
    ctx.save(); ctx.globalAlpha = a;
    // big faint clock face behind, hand sweeps with the parcel
    const dial = E.outCubic(prog(t, 8.95, 9.5));
    if (dial > 0) {
      ctx.save(); ctx.globalAlpha *= dial;
      const cx = 960, cy = 660, R = 250 * lerp(0.85, 1, dial);
      ctx.strokeStyle = '#E8ECF8'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.283); ctx.stroke();
      for (let i = 0; i < 12; i++) { const an = i / 12 * 6.283; ctx.beginPath(); ctx.moveTo(cx + Math.cos(an) * (R - 22), cy + Math.sin(an) * (R - 22)); ctx.lineTo(cx + Math.cos(an) * (R - 8), cy + Math.sin(an) * (R - 8)); ctx.stroke(); }
      const hand = -Math.PI / 2 + 4.6 * E.outQuart(prog(t, 9.55, 10.55)) + 0.15 * prog(t, 10.55, 11.5);
      ctx.strokeStyle = '#DDE3F4'; ctx.lineWidth = 8; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(hand) * (R - 60), cy + Math.sin(hand) * (R - 60)); ctx.stroke();
      ctx.restore();
    }
    // timeline
    const line = E.inOutCubic(prog(t, 8.95, 9.4));
    ctx.lineCap = 'round';
    ctx.strokeStyle = COL.track; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(TL.x0, TL.y); ctx.lineTo(lerp(TL.x0, TL.x1, line), TL.y); ctx.stroke();
    for (let i = 0; i <= 12; i++) {
      const x = lerp(TL.x0, TL.x1, i / 12), k = E.outBack(prog(t, 9.0 + i * 0.025, 9.25 + i * 0.025), 2);
      if (k <= 0) continue;
      ctx.strokeStyle = '#C7D0EC'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, TL.y + 18); ctx.lineTo(x, TL.y + 18 + (i % 3 ? 10 : 20) * k); ctx.stroke();
    }
    // the window: flies from the locker cell and snaps into place
    const fly = prog(t, 8.82, 9.42);
    const cell = { x: OPTS[CHOSEN].x + 10 * 1.07, y: OPTS[CHOSEN].y - 10 * 1.07, w: 21, h: 21 };
    const kk = E.outBack(fly, 1.6), kpos = E.inOutCubic(fly);
    const wx = lerp(cell.x, WIN.x, kpos), wy = lerp(cell.y, WIN.y, kpos), ww = lerp(cell.w, WIN.w, kk), wh = lerp(cell.h, WIN.h, kk);
    const hit = prog(t, 10.55, 10.9);
    rrect(wx + (WIN.w - ww) * (1 - kpos) * 0, wy, ww, wh, lerp(3, 14, kpos)); ctx.fillStyle = COL.yellow; ctx.fill();
    if (hit > 0 && hit < 1) { ctx.save(); ctx.globalAlpha *= 1 - hit; ctx.lineWidth = 5; ctx.strokeStyle = COL.yellow; const g = 26 * E.outCubic(hit); rrect(WIN.x - g, WIN.y - g, WIN.w + 2 * g, WIN.h + 2 * g, 14 + g); ctx.stroke(); ctx.restore(); }
    // target mark
    const mk = prog(t, 9.4, 9.6);
    if (mk > 0) { ctx.strokeStyle = COL.blue; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(MARK, WIN.y + WIN.h / 2 - 22 * mk); ctx.lineTo(MARK, WIN.y + WIN.h / 2 + 22 * mk); ctx.stroke(); }
    // label
    const lk = E.outCubic(prog(t, 9.45, 9.8));
    if (lk > 0) { ctx.save(); ctx.globalAlpha *= lk; ctx.font = '26px IDBold'; ctx.fillStyle = COL.ink; ctx.textAlign = 'center'; ctx.fillText(COPY.window, MARK, WIN.y + WIN.h + 62 - (1 - lk) * 14); ctx.restore(); }
    // travelled part of the line
    const run = E.outQuart(prog(t, 9.55, 10.55));
    const px = lerp(TL.x0, MARK, run);
    if (run > 0) { ctx.strokeStyle = COL.blue; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(TL.x0, TL.y); ctx.lineTo(px, TL.y); ctx.stroke(); }
    ctx.restore();
    // the parcel rides the timeline and lands on the mark
    if (t > 9.45 && t < 11.75) {
      const appear = E.outBack(prog(t, 9.45, 9.65), 2);
      const bounce = Math.sin(Math.PI * prog(t, 10.55, 10.75)) * 6;
      const exitK = E.inOutCubic(prog(t, 11.4, 11.75));
      const lm = logoMetrics();
      const ex = lerp(px, lm.dotX, exitK), ey = lerp(TL.y - 14 + bounce, lm.dotY + 120, exitK) - Math.sin(Math.PI * exitK) * 120;
      ctx.save(); ctx.globalAlpha = 1 - exitK;
      drawParcel(ex, ey, 64 * appear * (1 - 0.5 * exitK), { shadowA: 1 - exitK });
      ctx.restore();
      if (exitK > 0) circle(ex, ey - 16, 22 * exitK, COL.yellow);
      badge(MARK + 54, TL.y - 82, 22, prog(t, 10.58, 10.85) * (1 - prog(t, 11.3, 11.45)));
    }
  }

  // ── reveal: every route converges into the logo ──
  if (t > 11.3) {
    const lm = logoMetrics(), cx = 960, cy = 470;
    const disc = E.inOutCubic(prog(t, 11.62, 12.05));
    // converging lines
    for (let i = 0; i < 14; i++) {
      const an = i / 14 * Math.PI * 2 + 0.35, st = 11.32 + (i % 5) * 0.035;
      const k = prog(t, st, st + 0.42); if (k <= 0 || k >= 1) continue;
      const R = 1250, bend = (i % 2 ? 1 : -1) * 0.5;
      const b = [{ x: cx + Math.cos(an) * R, y: cy + Math.sin(an) * R }, null, null, { x: cx, y: cy }];
      b[1] = { x: cx + Math.cos(an + bend) * R * 0.6, y: cy + Math.sin(an + bend) * R * 0.6 };
      b[2] = { x: cx + Math.cos(an + bend * 0.5) * R * 0.25, y: cy + Math.sin(an + bend * 0.5) * R * 0.25 };
      const head = E.inOutCubic(k), tail = E.inCubic(k);
      ctx.save(); ctx.lineCap = 'round'; ctx.strokeStyle = i % 3 === 0 ? COL.yellow : COL.blue; ctx.lineWidth = i % 3 === 0 ? 8 : 6;
      strokeBez(b, tail, head); ctx.restore();
    }
    if (disc > 0) {
      ctx.save(); ctx.fillStyle = COL.blue; ctx.beginPath(); ctx.arc(cx, cy, disc * 1300, 0, 6.283); ctx.fill(); ctx.restore();
    }
    // logo + lines, with a slow push-in on the hold
    const push = 1 + 0.025 * E.inOutSine(prog(t, 12.4, 15));
    ctx.save(); ctx.translate(960, 540); ctx.scale(push, push); ctx.translate(-960, -540);
    ctx.font = `${LOGO.size}px IDBlack`; ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
    let lx = lm.x0;
    ['G', 'L', 'S'].forEach((ch, i) => {
      const w = ctx.measureText(ch).width;
      const k = E.outExpo(prog(t, 11.95 + i * 0.06, 12.45 + i * 0.06));
      if (k > 0) {
        ctx.save(); ctx.beginPath(); ctx.rect(lx - 20, LOGO.baseline - LOGO.size, w + 40, LOGO.size + 10); ctx.clip();
        ctx.fillText(ch, lx, LOGO.baseline + (1 - k) * LOGO.size * 0.9); ctx.restore();
      }
      lx += w;
    });
    // the parcel lands as the yellow dot
    const land = prog(t, 11.75, 12.38);
    if (land > 0) {
      const k = E.inOutCubic(land);
      const start = { x: lm.dotX, y: lm.dotY + 120 };
      const x = lerp(start.x, lm.dotX, k), y = lerp(start.y, lm.dotY, k) - Math.sin(Math.PI * k) * 160;
      const sq = prog(t, 12.38, 12.6), squash = Math.sin(Math.PI * sq) * 0.22 * (1 - sq);
      const r = lerp(22, lm.dot / 2, k);
      ctx.save(); ctx.translate(x, y + r); ctx.scale(1 + squash, 1 - squash); circle(0, -r, r, COL.yellow); ctx.restore();
      const rp = prog(t, 12.38, 12.9);
      if (rp > 0 && rp < 1) ring(lm.dotX, lm.dotY, lm.dot / 2 + 50 * E.outCubic(rp), 4, COL.yellow, 1 - rp);
    }
    // claim
    const ck = E.outExpo(prog(t, 12.55, 13.1));
    if (ck > 0) {
      ctx.save(); ctx.globalAlpha = clamp(ck * 1.5); ctx.font = '42px IDBold'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
      ctx.beginPath(); ctx.rect(600, 600, 720, 84); ctx.clip();
      ctx.fillText(COPY.claim, 960, 662 + (1 - ck) * 64); ctx.restore();
    }
    // credit
    const cr = E.outCubic(prog(t, 12.95, 13.45));
    if (cr > 0) {
      ctx.save(); ctx.globalAlpha = cr; ctx.textAlign = 'center';
      ctx.fillStyle = COL.yellow; ctx.fillRect(960 - 24, 868 + (1 - cr) * 10, 48, 4);
      ctx.font = '27px IDBold'; ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.fillText(COPY.credit, 960, 918 + (1 - cr) * 10);
      ctx.font = '24px IDSemi'; ctx.fillStyle = 'rgba(255,255,255,.72)'; ctx.fillText(COPY.note, 960, 956 + (1 - cr) * 10);
      ctx.restore();
    }
    ctx.restore();
  }

  // ── headline layer: white veil so type always sits on calm ground ──
  const veil = (prog(t, 0.45, 1.0)) * (1 - prog(t, 11.5, 11.7));
  if (veil > 0) {
    const g = ctx.createLinearGradient(0, 0, 0, 420);
    g.addColorStop(0, `rgba(255,255,255,${0.96 * veil})`); g.addColorStop(0.62, `rgba(255,255,255,${0.88 * veil})`); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, 420);
  }
  const TOP = 92;
  headline(t, { parts: [{ text: COPY.hook, at: 0.3 }], out: 1.88, top: TOP });
  headline(t, { parts: [{ text: COPY.pickup[0], at: 2.12 }, { text: COPY.pickup[1], at: 2.82 }], out: 3.86, top: TOP, split: true });
  headline(t, { parts: [{ text: COPY.track, at: 4.1 }], out: 6.38, top: TOP });
  headline(t, { parts: [{ text: COPY.flex, at: 6.68 }], out: 8.78, top: TOP });
  headline(t, { parts: [{ text: COPY.time[0], at: 9.12 }, { text: COPY.time[1], at: 10.6 }], out: 11.3, top: TOP, split: true });
}

/* ───────────────────────────── output ───────────────────────────── */
// Motion blur: sub-frames over a ~126° shutter; more samples where things move fastest so blur stays smooth.
const SHUTTER = 0.35;
let SHARP_LABELS = false;
const FAST = [[0.5, 1.5], [1.95, 2.45], [3.3, 4.2], [6.35, 7.0], [11.3, 12.15]];
function compose(t, blur = true) {
  if (!blur) { render(t); octx.globalAlpha = 1; octx.drawImage(buf, 0, 0); return; }
  const sub = FAST.some(([a, b]) => t >= a && t <= b) ? 12 : 5;
  SHARP_LABELS = true;
  for (let i = 0; i < sub; i++) {
    const ts = clamp(t + (i / (sub - 1) - 0.5) * SHUTTER / FPS, 0, DURATION - 1e-4);
    render(ts);
    octx.globalAlpha = 1 / (i + 1); octx.drawImage(buf, 0, 0);
  }
  SHARP_LABELS = false;
  octx.globalAlpha = 1;
  if (labelPass(t)) octx.drawImage(buf, 0, 0);
}
let showSafe = false;
function overlaySafe() {
  if (!showSafe) return;
  const sw = H * 9 / 16, x = (W - sw) / 2;
  octx.save(); octx.fillStyle = 'rgba(0,0,0,.45)'; octx.fillRect(0, 0, x, H); octx.fillRect(x + sw, 0, x, H);
  octx.strokeStyle = '#ff2d6f'; octx.lineWidth = 2; octx.strokeRect(x, 0, sw, H); octx.restore();
}
window.renderFrame = (f, opts = {}) => {
  compose(f / FPS, opts.blur !== false);
  if (opts.safe) { showSafe = true; overlaySafe(); showSafe = false; }
  return out.toDataURL('image/png').split(',')[1];
};

const isRender = new URLSearchParams(location.search).has('render');
if (isRender) document.body.classList.add('render');
Promise.all(['66px IDBlack', '26px IDBold', '24px IDSemi'].map(f => document.fonts.load(f))).then(() => {
  window.__ready = true;
  if (isRender) return;
  const scrub = document.getElementById('scrub'), tc = document.getElementById('tc'), snd = document.getElementById('snd');
  let playing = false, t0 = 0, f = 0;
  const draw = () => { compose(f / FPS, !playing); overlaySafe(); scrub.value = f; tc.textContent = (f / FPS).toFixed(2) + ' s'; };
  const loop = now => {
    if (!playing) return;
    f = Math.floor((now - t0) / 1000 * FPS);
    if (f >= FRAMES) { playing = false; f = FRAMES - 1; snd.pause(); }
    draw(); if (playing) requestAnimationFrame(loop);
  };
  const toggle = () => {
    playing = !playing;
    if (playing) { if (f >= FRAMES - 1) f = 0; t0 = performance.now() - f / FPS * 1000; snd.currentTime = f / FPS; snd.play().catch(() => {}); requestAnimationFrame(loop); }
    else { snd.pause(); draw(); }
  };
  document.getElementById('play').onclick = toggle;
  scrub.oninput = () => { playing = false; snd.pause(); f = +scrub.value; draw(); };
  document.getElementById('safe').onchange = e => { showSafe = e.target.checked; draw(); };
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    if (e.code === 'KeyS') { showSafe = !showSafe; document.getElementById('safe').checked = showSafe; draw(); }
    if (e.code === 'ArrowRight') { f = Math.min(FRAMES - 1, f + 1); draw(); }
    if (e.code === 'ArrowLeft') { f = Math.max(0, f - 1); draw(); }
  });
  draw();
});
</script>
